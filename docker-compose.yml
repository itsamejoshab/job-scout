# Default logging configuration for all services
x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Shared build for the Go app image (api + worker run from the same binary)
x-jobscout-build: &jobscout-build
  context: ./job-scout
  dockerfile: Dockerfile

services:
  # --- core data stores ---
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-defaultx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-defaultx}
      POSTGRES_DB: ${POSTGRES_DB:-defaultx}
      POSTGRES_HOST: ${POSTGRES_HOST:-defaultx}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/pgdata:rw
    networks:
      - backend
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-defaultx} -d ${POSTGRES_DB:-defaultx}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    shm_size: '256mb'
    logging: *default-logging

  # --- app: API (also runs migrations + seeds settings on startup) ---
  job-scout-api:
    container_name: job-scout-api
    build: *jobscout-build
    command: ["api"]
    env_file: [ ./job-scout/.env ]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging

  # --- app: Temporal worker ---
  job-scout-worker:
    container_name: job-scout-worker
    build: *jobscout-build
    command: ["worker"]
    env_file: [ ./job-scout/.env ]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      job-scout-api:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend
    logging: *default-logging

  # --- orchestration ---
  temporal:
    container_name: temporal
    image: temporalio/auto-setup:latest
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=${POSTGRES_PORT:-5432}
      - AUTO_SETUP=true
      - ENABLE_ES=false
      - POSTGRES_USER=${POSTGRES_USER:-defaultx}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-defaultx}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    volumes:
      - ./config/dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233" # temporal frontend
      - "7234:7234" # temporal history
      - "7235:7235" # temporal matching
      - "7236:7236" # temporal worker
    networks:
      - backend
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.21.3
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal
    ports: [ "8082:8080" ]
    networks:
      - backend

networks:
  backend:
    name: job-scout-backend
    driver: bridge
